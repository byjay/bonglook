<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Bmail 다운로드</title>
  <!--
    다운로드 팝업 상단 띠. 아래쪽은 서비스 페이지(WebContentsView)가 덮는다.
    대비(실측 계산): #ffffff on #0b4f8a = 8.4:1 · on #0b5d33 = 7.9:1 · on #8a2c0d = 8.6:1
                    버튼 #0b4f8a on #ffffff = 8.4:1 · 안내문 #201f1e on #ffffff = 16.1:1
  -->
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{height:100%; font-family:'Segoe UI','Malgun Gothic',sans-serif; background:#ffffff; color:#201f1e; overflow:hidden;}
    #bar{background:#0b4f8a; color:#ffffff; -webkit-app-region:drag; user-select:none;}
    #bar.st-done{background:#0b5d33;}
    #bar.st-manual, #bar.st-blocked{background:#8a2c0d;}
    .row{display:flex; align-items:center; gap:6px; padding:0 8px;}
    .r1{height:28px; font-size:12px;}
    .r2{min-height:34px; font-size:12.5px; padding-bottom:4px;}
    #domain{font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    #status{flex:1; min-width:0;}
    #name{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    #msg{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    #prog{height:3px; background:rgba(255,255,255,.3);}
    #prog-fill{height:100%; width:0; background:#ffffff;}
    button{-webkit-app-region:no-drag; font-family:inherit; cursor:pointer; background:#ffffff; color:#0b4f8a;
      border:1px solid #ffffff; border-radius:4px; font-size:11.5px; font-weight:600; padding:2px 8px; white-space:nowrap;}
    #bar.st-done button{color:#0b5d33;}
    #bar.st-manual button, #bar.st-blocked button{color:#8a2c0d;}
    button:hover{background:#e6eef6;}
    #x{padding:0 7px; font-size:14px; line-height:20px;}
    .hide{display:none !important;}
    #note{padding:16px; font-size:13px; line-height:1.6; white-space:pre-line; word-break:break-all;}
  </style>
</head>
<body>
  <div id="bar">
    <div class="row r1">
      <span id="domain"></span>
      <button id="b-enlarge" data-act="enlarge" title="창 크게/작게">크게</button>
      <button data-act="browser" title="외부 브라우저로 이 링크 열기">브라우저로 열기</button>
      <button id="x" data-act="close" title="닫기" aria-label="닫기">×</button>
    </div>
    <div class="row r2">
      <div id="status" role="status" aria-live="polite"><div id="name"></div><div id="msg"></div></div>
      <button id="b-open" class="hide" data-act="open">열기</button>
      <button id="b-folder" class="hide" data-act="folder">폴더 열기</button>
    </div>
    <div id="prog"><div id="prog-fill"></div></div>
  </div>
  <div id="note" class="hide"></div>
  <script src="link-popup.js"></script>
</body>
</html>
